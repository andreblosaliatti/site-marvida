name: Deploy MV Safety to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "mvsafety/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Configure GitHub Pages URLs
        shell: bash
        env:
          SITE_URL_INPUT: ${{ vars.MVSAFETY_SITE_URL }}
          BASE_PATH_INPUT: ${{ vars.MVSAFETY_BASE_PATH }}
        run: |
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ -n "$SITE_URL_INPUT" ]]; then
            site_url="${SITE_URL_INPUT%/}"
            base_path="${BASE_PATH_INPUT#/}"
            base_path="${base_path%/}"
          else
            site_url="https://${repository_owner,,}.github.io"
            if [[ "${repository_name,,}" != "${repository_owner,,}.github.io" ]]; then
              base_path="$repository_name"
            else
              base_path=""
            fi
          fi
          echo "MVSAFETY_SITE_URL=$site_url" >> "$GITHUB_ENV"
          echo "MVSAFETY_BASE_PATH=$base_path" >> "$GITHUB_ENV"

      - name: Build static site
        working-directory: mvsafety
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          MVSAFETY_FORM_ENDPOINT: ${{ vars.MVSAFETY_FORM_ENDPOINT }}
        run: php scripts/build-static.php

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mvsafety/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
